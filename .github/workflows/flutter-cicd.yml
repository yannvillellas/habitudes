name: Flutter CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  check_version_bump:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version was bumped vs base branch
        run: |
          PR_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          BASE_VERSION=$(git show "origin/${{ github.base_ref }}:pubspec.yaml" | grep '^version:' | awk '{print $2}')
          if [ "$PR_VERSION" = "$BASE_VERSION" ]; then
            echo "::error::pubspec.yaml version ($PR_VERSION) was not bumped. Please update it before merging."
            exit 1
          fi
          echo "Base: $BASE_VERSION → PR: $PR_VERSION ✓"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test

  build_android_apk:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/upload-keystore.jks
      - name: Write key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties
      - name: Install dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: habitudes-android-apk-${{ github.run_number }}-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk

  build_android_aab:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/upload-keystore.jks
      - name: Write key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=upload" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties
      - name: Install dependencies
        run: flutter pub get
      - name: Build release AAB
        run: flutter build appbundle --release
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: habitudes-android-aab-${{ github.run_number }}-${{ github.sha }}
          path: build/app/outputs/bundle/release/app-release.aab

  release_android:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [build_android_apk, build_android_aab]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: habitudes-android-apk-${{ github.run_number }}-${{ github.sha }}
          path: build/app/outputs/flutter-apk
      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: habitudes-android-aab-${{ github.run_number }}-${{ github.sha }}
          path: build/app/outputs/bundle/release
      - name: Read version from pubspec
        id: pubspec
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Fail if tag exists
        run: |
          git fetch --tags
          if git rev-parse "${{ steps.pubspec.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag already exists: ${{ steps.pubspec.outputs.tag }}"
            exit 1
          fi
      - name: Create tag
        run: |
          git tag "${{ steps.pubspec.outputs.tag }}"
          git push origin "${{ steps.pubspec.outputs.tag }}"
      - name: Upload APK + AAB to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pubspec.outputs.tag }}
          name: Release ${{ steps.pubspec.outputs.tag }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
