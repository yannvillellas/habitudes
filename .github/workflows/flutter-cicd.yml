name: Flutter CI/CD

on:
    push:
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  cache: true
            - name: Install dependencies
              run: flutter pub get
            - name: Analyze
              run: flutter analyze
            - name: Run tests
              run: flutter test

    build_android_apk:
        runs-on: ubuntu-latest
        needs: test
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Set up Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  cache: true
            - name: Install dependencies
              run: flutter pub get
            - name: Build release APK
              run: flutter build apk --release
            - name: Upload APK artifact
              uses: actions/upload-artifact@v4
              with:
                  name: habitudes-android-apk-${{ github.run_number }}-${{ github.sha }}
                  path: build/app/outputs/flutter-apk/app-release.apk
